<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ИП «Неделько» — приём металлолома в Пятигорске и Минеральных Водах. Высокие цены, честное взвешивание, моментальная оплата." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>ИП «Неделько» КМВ — Приём металлолома в Пятигорске и Минеральных Водах</title>
    <script>
      // SPA redirect fallback for static hosting (GitHub Pages, Timeweb).
      // When a user navigates directly to /admin/prices, the static host
      // serves 404.html. We redirect to the same path via index.html so
      // the React router can handle the route client-side.
      (function () {
        var pathSegmentsToKeep = 0;
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
